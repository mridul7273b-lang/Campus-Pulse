<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="75%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Atmospheric Night Sky / Hills Backdrop -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>

  <!-- Dighi Hills Backdrop Contours -->
  <path d="M 0 520 Q 300 410 700 460 T 1600 480 L 1600 900 L 0 900 Z" fill="#1e3a29" opacity="0.7"/>
  <path d="M 0 560 Q 450 480 950 510 T 1600 530 L 1600 900 L 0 900 Z" fill="url(#hillGrad)"/>

  <!-- Campus Green Lawns & Plazas -->
  <path d="M 0 660 L 1600 660 L 1600 900 L 0 900 Z" fill="#15803d"/>
  <polygon points="200,900 1400,900 1100,660 500,660" fill="#166534" opacity="0.6"/>

  <!-- Academic Center & Ramanujan Administrative Complex (Main Building) -->
  <g>
    <!-- Main Center Block -->
    <rect x="520" y="440" width="560" height="230" fill="url(#buildingGrad)" rx="3"/>
    <rect x="500" y="420" width="600" height="22" fill="#0f172a" rx="2"/>
    
    <!-- Glazed Modern Atrium -->
    <rect x="710" y="460" width="180" height="210" fill="url(#glassGrad)"/>
    <g stroke="#ffffff" stroke-width="1.5" opacity="0.6">
      <line x1="755" y1="460" x2="755" y2="670"/>
      <line x1="800" y1="460" x2="800" y2="670"/>
      <line x1="845" y1="460" x2="845" y2="670"/>
      <line x1="710" y1="510" x2="890" y2="510"/>
      <line x1="710" y1="560" x2="890" y2="560"/>
      <line x1="710" y1="610" x2="890" y2="610"/>
    </g>

    <!-- Wing Windows Left -->
    <g fill="#0284c7" opacity="0.75">
      <rect x="545" y="470" width="40" height="28" rx="2"/>
      <rect x="600" y="470" width="40" height="28" rx="2"/>
      <rect x="655" y="470" width="40" height="28" rx="2"/>

      <rect x="545" y="520" width="40" height="28" rx="2"/>
      <rect x="600" y="520" width="40" height="28" rx="2"/>
      <rect x="655" y="520" width="40" height="28" rx="2"/>

      <rect x="545" y="570" width="40" height="28" rx="2"/>
      <rect x="600" y="570" width="40" height="28" rx="2"/>
      <rect x="655" y="570" width="40" height="28" rx="2"/>
    </g>

    <!-- Wing Windows Right -->
    <g fill="#0284c7" opacity="0.75">
      <rect x="910" y="470" width="40" height="28" rx="2"/>
      <rect x="965" y="470" width="40" height="28" rx="2"/>
      <rect x="1020" y="470" width="40" height="28" rx="2"/>

      <rect x="910" y="520" width="40" height="28" rx="2"/>
      <rect x="965" y="520" width="40" height="28" rx="2"/>
      <rect x="1020" y="520" width="40" height="28" rx="2"/>

      <rect x="910" y="570" width="40" height="28" rx="2"/>
      <rect x="965" y="570" width="40" height="28" rx="2"/>
      <rect x="1020" y="570" width="40" height="28" rx="2"/>
    </g>

    <!-- Department Towers (R&D Cluster & Engineering Wings) -->
    <rect x="220" y="480" width="280" height="190" fill="#e2e8f0" rx="3"/>
    <rect x="200" y="465" width="320" height="18" fill="#1e293b"/>
    <rect x="1100" y="480" width="280" height="190" fill="#e2e8f0" rx="3"/>
    <rect x="1080" y="465" width="320" height="18" fill="#1e293b"/>

    <!-- AIT Institution Crest & Lettering -->
    <text x="800" y="437" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold" letter-spacing="4">ARMY INSTITUTE OF TECHNOLOGY • PUNE</text>
  </g>

  <!-- Architectural Plaza Lighting & Solar Array -->
  <g fill="#38bdf8" opacity="0.9">
    <circle cx="480" cy="690" r="4"/>
    <circle cx="620" cy="710" r="4"/>
    <circle cx="800" cy="725" r="5"/>
    <circle cx="980" cy="710" r="4"/>
    <circle cx="1120" cy="690" r="4"/>
  </g>

  <!-- Campus Overlay Tag -->
  <rect x="50" y="50" width="380" height="65" fill="#0a0b0d" opacity="0.85" rx="4"/>
  <text x="75" y="80" font-family="monospace" font-size="12" fill="#e11d48" font-weight="bold">AIT PUNE // CAMPUS SPATIAL METRICS</text>
  <text x="75" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#ffffff">30-Acre Autonomous Campus Enclave, Dighi Hills</text>
</svg>
