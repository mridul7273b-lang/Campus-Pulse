<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="80%" stop-color="#eef2f6"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <linearGradient id="prismGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#e0f2fe" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#f0abfc" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="spectrum1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="20%" stop-color="#f97316"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#e0e7ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glassBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Clean Minimalist Tech Studio Background -->
  <rect width="1200" height="900" fill="url(#bgGlow)"/>

  <!-- Optical Grid & Micro Reticle -->
  <g stroke="#94a3b8" stroke-width="0.75" opacity="0.3">
    <line x1="100" y1="450" x2="1100" y2="450"/>
    <line x1="600" y1="100" x2="600" y2="800"/>
    <circle cx="600" cy="450" r="320" fill="none" stroke-dasharray="4 6"/>
    <circle cx="600" cy="450" r="240" fill="none"/>
    <circle cx="600" cy="450" r="160" fill="none" stroke-dasharray="2 4"/>
    <circle cx="600" cy="450" r="80" fill="none"/>
  </g>

  <!-- Incident Optical White Coherent Beam -->
  <path d="M 50 450 L 520 450" stroke="#0ea5e9" stroke-width="8" opacity="0.85" filter="url(#softGlow)"/>
  <path d="M 50 450 L 520 450" stroke="#ffffff" stroke-width="3"/>

  <!-- Spectral Dispersion Fans (Refracted Rainbow Rays) -->
  <g filter="url(#softGlow)" opacity="0.9">
    <path d="M 580 450 L 1150 220" stroke="#ec4899" stroke-width="5"/>
    <path d="M 580 450 L 1150 290" stroke="#f43f5e" stroke-width="4.5"/>
    <path d="M 580 450 L 1150 360" stroke="#f97316" stroke-width="4.5"/>
    <path d="M 580 450 L 1150 430" stroke="#eab308" stroke-width="4"/>
    <path d="M 580 450 L 1150 500" stroke="#10b981" stroke-width="4.5"/>
    <path d="M 580 450 L 1150 570" stroke="#06b6d4" stroke-width="5"/>
    <path d="M 580 450 L 1150 640" stroke="#3b82f6" stroke-width="5"/>
    <path d="M 580 450 L 1150 710" stroke="#8b5cf6" stroke-width="5.5"/>
  </g>

  <!-- Prismatic Refraction Crystal Core (Hexagonal Precision Glass) -->
  <polygon points="600,240 760,340 760,560 600,660 440,560 440,340" 
           fill="url(#prismGrad)" stroke="#38bdf8" stroke-width="2.5" opacity="0.9"/>
  <polygon points="600,240 760,340 600,450 440,340" fill="#ffffff" opacity="0.4"/>
  <polygon points="760,340 760,560 600,450" fill="#38bdf8" opacity="0.25"/>
  <polygon points="600,660 760,560 600,450 440,560" fill="#c084fc" opacity="0.3"/>
  <polygon points="440,340 440,560 600,450" fill="#0284c7" opacity="0.2"/>

  <!-- Optical Ring & Coordinate Markers -->
  <circle cx="600" cy="450" r="14" fill="#ffffff" stroke="#e11d48" stroke-width="3"/>
  <circle cx="600" cy="450" r="5" fill="#e11d48"/>
  <text x="630" y="445" font-family="monospace" font-size="12" fill="#0f172a" font-weight="bold">λ = 532.8 nm (COHERENT)</text>
  <text x="630" y="465" font-family="monospace" font-size="11" fill="#64748b">AIT HIGH-ENERGY PHOTONICS LAB</text>
</svg>
