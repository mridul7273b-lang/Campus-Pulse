<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0e"/>
      <stop offset="60%" stop-color="#111317"/>
      <stop offset="100%" stop-color="#181b20"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0070f3" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#ff0080"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#darkBg)"/>
  <rect width="600" height="800" fill="url(#cardGlow)"/>

  <!-- Optical Grid Rulers -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.4">
    <line x1="60" y1="50" x2="60" y2="750"/>
    <line x1="540" y1="50" x2="540" y2="750"/>
    <line x1="50" y1="400" x2="550" y2="400"/>
    <circle cx="300" cy="400" r="220" fill="none" stroke-dasharray="3 6"/>
    <circle cx="300" cy="400" r="150" fill="none"/>
  </g>

  <!-- Prismatic Refraction Cylinder Core -->
  <g filter="url(#neonGlow)">
    <ellipse cx="300" cy="400" rx="140" ry="200" fill="none" stroke="url(#neonBeam)" stroke-width="4" transform="rotate(-25 300 400)"/>
    <ellipse cx="300" cy="400" rx="90" ry="140" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.8" transform="rotate(35 300 400)"/>
    
    <!-- Multi-spectral Light Dispersion Waves -->
    <path d="M 80 400 Q 200 280 300 400 T 520 400" fill="none" stroke="#ff007a" stroke-width="3" opacity="0.9"/>
    <path d="M 80 420 Q 200 320 300 420 T 520 420" fill="none" stroke="#00d2ff" stroke-width="3" opacity="0.8"/>
    <path d="M 80 380 Q 200 240 300 380 T 520 380" fill="none" stroke="#7928ca" stroke-width="3" opacity="0.85"/>
  </g>

  <!-- Specimen Micro Labels -->
  <text x="80" y="100" font-family="monospace" font-size="12" fill="#94a3b8" letter-spacing="2">SPECIMEN CALIBRATION // 02</text>
  <text x="80" y="125" font-family="monospace" font-size="10" fill="#ff007a">STATUS: COLLIMATED HIGH GAIN</text>
  <text x="80" y="720" font-family="monospace" font-size="11" fill="#64748b">AIT PUNE OPTICAL R&amp;D // DIGHI HILLS</text>
  <text x="440" y="720" font-family="monospace" font-size="11" fill="#38bdf8">REFRACT: 1.544</text>
</svg>
